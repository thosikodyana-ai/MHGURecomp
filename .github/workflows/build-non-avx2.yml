name: Build MHGURecomp Non-AVX2 v3 (AMD A10-7800 / bdver3)

on:
  workflow_dispatch:
    inputs:
      genarch:
        description: 'Target CPU Architecture Flags (GENARCH)'
        required: true
        default: '-march=bdver3 -mtune=bdver3 -mno-avx2 -mno-bmi2 -mno-movbe'
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build-windows-non-avx2:
    name: Windows UCRT64 Non-AVX2 v3 (AMD A10-7800 Movie06 Fix)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout Patched MHGURecomp Repository
        uses: actions/checkout@v4

      - name: Setup MSYS2 UCRT64 Toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            make
            git
            grep
            diffutils
            curl
            unzip
            zip
            mingw-w64-ucrt-x86_64-binutils
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-clang
            mingw-w64-ucrt-x86_64-lld
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-sdl3
            mingw-w64-ucrt-x86_64-shaderc
            mingw-w64-ucrt-x86_64-nasm
            mingw-w64-ucrt-x86_64-vulkan-headers
            mingw-w64-ucrt-x86_64-vulkan-loader
            mingw-w64-ucrt-x86_64-vulkan-memory-allocator

      - name: Compile mhgurecomp.exe (Non-AVX2 bdver3 + Movie06 FFmpeg Fix + XSAVE YMM Mask Fix)
        run: |
          TARGET_ARCH="${{ inputs.genarch || '-march=bdver3 -mtune=bdver3 -mno-avx2 -mno-bmi2 -mno-movbe' }}"
          echo "Compiling with GENARCH: $TARGET_ARCH"
          make -j4 build/mhgurecomp.exe bundle licenses GEN_SRC="" GENARCH="$TARGET_ARCH"

      - name: Fetch Official Release 0.10.1 & Run v3 AOT .tramp Patcher (19,953 Sites) on mhgugame.dll
        run: |
          curl -fL --retry 3 -o official_release.zip https://github.com/morerokk/MHGURecomp/releases/download/0.10.1/Windows-MHGURecomp.0.10.1.zip
          unzip -q official_release.zip -d official_rel
          cp -f official_rel/Windows-MHGURecomp/mhgugame.dll build/mhgugame.dll
          cp -rf official_rel/Windows-MHGURecomp/bonus build/ 2>/dev/null || true
          cp -rf official_rel/Windows-MHGURecomp/cheats build/ 2>/dev/null || true
          cp -rf official_rel/Windows-MHGURecomp/data build/ 2>/dev/null || true
          cp -rf official_rel/Windows-MHGURecomp/mods build/ 2>/dev/null || true
          python3 tools/patch_mhgugame_dll.py build/mhgugame.dll

      - name: Package Ready-to-Play Non-AVX2 v3 Zip Archives
        run: |
          (cd build && zip -r9 ../MHGURecomp-v3-Movie06-Fix-Patch.zip mhgugame.dll mhgurecomp.exe)
          mv build Windows-MHGURecomp-NonAVX2-A10-7800-v3
          zip -r9 Windows-MHGURecomp-NonAVX2-A10-7800-v3.zip Windows-MHGURecomp-NonAVX2-A10-7800-v3
          ls -lh MHGURecomp-v3-Movie06-Fix-Patch.zip Windows-MHGURecomp-NonAVX2-A10-7800-v3.zip

      - name: Upload Build Artifact v3
        uses: actions/upload-artifact@v4
        with:
          name: Windows-MHGURecomp-NonAVX2-A10-7800-v3
          path: |
            MHGURecomp-v3-Movie06-Fix-Patch.zip
            Windows-MHGURecomp-NonAVX2-A10-7800-v3.zip
          retention-days: 30

      - name: Publish GitHub Release (v0.10.1-non-avx2-a10-7800-v3)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.10.1-non-avx2-a10-7800-v3
          name: "MHGURecomp 0.10.1 Non-AVX2 v3 (Movie06 Black Screen Fix · 19,953 Static AOT .tramp Patch)"
          body: |
            ### Native Non-AVX2 v3 Build for AMD A10-7800 (Steamroller / bdver3) — Movie06.mp4 Black Screen Fix
            - **Fixed `movie06.mp4` Black Screen After Capcom Logo**:
              - **100% Static AOT Binary Translation (`mhgugame.dll`)**: Appends executable `.tramp` section (`RVA 0x057af000`) and translates all **19,953 non-bdver3 instructions** (`10,068 RORX`, `4,846 SHLX`, `3,338 SHRX`, `971 MOVBE`, `648 SARX`, `57 BZHI`, `23 VPBROADCASTD`, `2 VPBROADCASTB`) ahead-of-time into native AMD A10-7800 instructions, eliminating the 6-thread H.264/AAC VEH exception lock contention (`0` `#UD` exceptions at runtime).
              - **FFmpeg H.264/AAC CPU Flags (`runtime/hle/movie.c` + `Makefile`)**: Forces FFmpeg to mask out `AV_CPU_FLAG_AVX2`, `AV_CPU_FLAG_BMI2`, and `AV_CPU_FLAG_AVX512` and compiles bundled FFmpeg with `GENARCH` (`-march=bdver3 -mno-avx2 -mno-bmi2 -mno-movbe`).
              - **XSAVE YMM Upper-Lane Restoration (`runtime/avx2_bmi2_veh.c`)**: Sets `XSTATE_MASK_AVX` in `XSAVE_HEADER.Mask` inside `write_ymm`.
            - **Download Options**:
              - **`MHGURecomp-v3-Movie06-Fix-Patch.zip`**: Lightweight patch containing `mhgugame.dll` + `mhgurecomp.exe` (extract & overwrite into your existing v2 folder).
              - **`Windows-MHGURecomp-NonAVX2-A10-7800-v3.zip`**: Complete standalone ready-to-play v3 bundle.
          files: |
            MHGURecomp-v3-Movie06-Fix-Patch.zip
            Windows-MHGURecomp-NonAVX2-A10-7800-v3.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
